# Tag v* -> CI stages the release on npm; a maintainer approves it with 2FA on npmjs.com.
# Trusted publishing (OIDC): no NPM_TOKEN secret.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest   # stage publish needs npm >= 11.15
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci && npm test
      - run: npm stage publish --provenance --access public