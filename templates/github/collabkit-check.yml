# managed by collabkit {{version}}
name: collabkit check
on:
  pull_request:
    paths: ["conversation/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx --yes collabkit-cli@{{version}} check --pr --base origin/${{ github.base_ref }}
